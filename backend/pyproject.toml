[project]
name = "youshu-ai-backend"
version = "0.1.0"
description = "AI 记账助手 - 后端服务（FastAPI + SQLAlchemy + PaddleOCR/Qwen-VL/DeepSeek）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "Pillow>=10.4.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
ai = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tests"]

[tool.ruff.lint]
# 起步阶段：只开基础规则，发现问题再逐步加严
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 行长度交给 formatter
    "B008",  # FastAPI 依赖里常见，误伤多
]

